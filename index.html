<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Heart – Interactive Paragraph</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f1;--ink:#2a1216;--muted:#7a5a5e;--red:#c4202f;--card:#ffffff;--line:#efd3cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0c0f;--ink:#fbeae6;--muted:#c3a0a4;--red:#ee4b5b;--card:#26131a;--line:#472a30}}
:root[data-theme="dark"]{--bg:#1a0c0f;--ink:#fbeae6;--muted:#c3a0a4;--red:#ee4b5b;--card:#26131a;--line:#472a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pulse{width:46px;height:46px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 0 var(--red)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.5rem;margin:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px}
#text{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.3rem,4.6vw,1.75rem);line-height:1.65;margin:0}
#text .caret{display:inline-block;width:2px;height:1.1em;background:var(--red);vertical-align:-0.15em;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#text .idle{color:var(--muted)}
.controls{margin-top:18px;display:grid;gap:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:700 1rem 'Cairo',system-ui,sans-serif;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--red);color:#fff;min-height:48px}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
label{display:grid;gap:6px;font-weight:500;color:var(--muted);font-size:.95rem}
input[type=range]{width:100%;accent-color:var(--red)}
.ctl{direction:rtl}
#note{font-size:.85rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <div class="top"><div class="pulse" id="pulse" aria-hidden="true"></div><h1>The Heart</h1></div>
  <section class="stage" aria-live="polite"><p id="text"><span class="idle">Press start to begin.</span></p></section>
  <div class="controls ctl">
    <div class="btns">
      <button id="start">ابدأ العرض التفاعلي</button>
      <button id="pause" class="alt" disabled>إيقاف مؤقت</button>
    </div>
    <label>قوة صوت النبضات <input type="range" id="vHeart" min="0" max="100" value="55"></label>
    <label>قوة صوت القراءة <input type="range" id="vVoice" min="0" max="100" value="100"></label>
    <label>سرعة الكتابة <input type="range" id="vSpeed" min="1" max="10" value="6"></label>
    <p id="note"></p>
  </div>
</main>
<script>
const TEXT="The heart is the most important organ in our body. It works all day and all night without stopping. It carries blood through the body. Blood runs through blood vessels. And the blood carries oxygen and nutrients to the cells. This gives our body energy to grow, play, and stay healthy.";
const sentences=TEXT.split(/(?<=[.!?])\s+/);
const $=id=>document.getElementById(id);
const el=$('text'),startB=$('start'),pauseB=$('pause'),pulse=$('pulse');
let ac=null,hg=null,running=false,paused=false,token=0,voice=null,beatTimer=null;

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/google uk english male/i.test(v.name))
    ||vs.find(v=>/en[-_]GB/i.test(v.lang)&&/male|daniel|oliver|arthur/i.test(v.name)&&!/female/i.test(v.name))
    ||vs.find(v=>/en[-_]GB/i.test(v.lang))
    ||vs.find(v=>/^en/i.test(v.lang))||null;
  $('note').textContent=voice?('الصوت: '+voice.name):'';
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}

function thump(t,f0,f1,peak,dur){
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o2.type='triangle';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  o2.frequency.setValueAtTime(f0*2.2,t);o2.frequency.exponentialRampToValueAtTime(f1*2.2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);o2.connect(g);g.connect(hg);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function beat(){
  if(!running||paused)return;
  const t=ac.currentTime+0.02;
  thump(t,95,48,1,0.16);
  thump(t+0.3,80,42,0.75,0.14);
  if(pulse.animate){
    pulse.animate([{transform:'scale(1)'},{transform:'scale(1.28)'},{transform:'scale(1)'}],{duration:230});
    setTimeout(()=>pulse.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:200}),300);
  }
  beatTimer=setTimeout(beat,880);
}
$('vHeart').oninput=e=>{if(hg)hg.gain.value=e.target.value/100*1.6;};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitResume(my){while(paused&&my===token)await sleep(80);}
async function typeSentence(s,span,my){
  for(const ch of s){
    if(my!==token)return;
    await waitResume(my);
    span.textContent+=ch;
    await sleep(140-$('vSpeed').value*12);
  }
}
function speak(s,my){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res();return;}
    const u=new SpeechSynthesisUtterance(s);
    if(voice)u.voice=voice;u.lang='en-GB';u.rate=0.9;u.pitch=1;
    u.volume=$('vVoice').value/100;
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
    const guard=setInterval(()=>{if(my!==token){clearInterval(guard);fin();}},200);
    setTimeout(()=>{clearInterval(guard);if(!paused)fin();},s.length*130+4000);
  });
}
async function run(){
  const my=++token;
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();hg=ac.createGain();hg.connect(ac.destination);}
  if(ac.state==='suspended')ac.resume();
  hg.gain.value=$('vHeart').value/100*1.6;
  speechSynthesis.cancel();
  running=true;paused=false;el.innerHTML='';
  startB.disabled=true;pauseB.disabled=false;pauseB.textContent='إيقاف مؤقت';
  clearTimeout(beatTimer);beat();
  const caret=document.createElement('span');caret.className='caret';
  for(let i=0;i<sentences.length;i++){
    if(my!==token)return;
    const span=document.createElement('span');
    el.appendChild(span);if(i<sentences.length-1)el.appendChild(document.createTextNode(' '));
    el.appendChild(caret);span.after(caret);
    await typeSentence(sentences[i],span,my);
    if(my!==token)return;
    await waitResume(my);
    await speak(sentences[i],my);
    await waitResume(my);
    await sleep(250);
  }
  if(my!==token)return;
  caret.remove();running=false;clearTimeout(beatTimer);
  startB.disabled=false;startB.textContent='إعادة العرض';pauseB.disabled=true;
}
startB.onclick=run;
pauseB.onclick=()=>{
  if(!running)return;
  paused=!paused;
  if(paused){speechSynthesis.pause();clearTimeout(beatTimer);pauseB.textContent='استئناف';}
  else{speechSynthesis.resume();pauseB.textContent='إيقاف مؤقت';beat();}
};
</script>
</body>
</html>
